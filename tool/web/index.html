<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span id="site-name" class="brand-name">Photo</span><span class="muted">Admin</span></div>
  <label class="search">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="search" type="search" placeholder="Search caption, filename, camera, lens…" aria-label="Search photos" autocomplete="off">
    <kbd>/</kbd>
  </label>
  <div class="topbar-actions">
    <button id="add-btn" class="btn">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      Add photos
    </button>
    <input type="file" id="file-input" multiple accept="image/*" hidden>
    <button id="add-folder-btn" class="btn btn-ghost" title="Add every JPEG in a folder and its subfolders">Add folder</button>
    <input type="file" id="folder-input" webkitdirectory multiple hidden>
    <div class="publish-wrap">
      <button id="publish-btn" class="btn btn-primary" aria-haspopup="dialog" aria-expanded="false">
        Publish <span id="change-badge" class="badge" hidden>0</span>
      </button>
      <div id="publish-pop" class="popover" role="dialog" aria-label="Publish changes" hidden>
        <div class="pop-head"><strong>Publish changes</strong><button class="icon-btn" data-close aria-label="Close"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <ul id="change-list" class="change-list"></ul>
        <div id="pending-deletes" class="note-danger" hidden></div>
        <div id="git-error" class="note-danger" hidden></div>
        <label class="field">
          <span class="label">Commit message</span>
          <input id="commit-msg" class="input" value="Update gallery">
        </label>
        <div class="pop-actions">
          <button class="btn btn-ghost" data-close>Cancel</button>
          <button id="commit-btn" class="btn btn-primary">Commit &amp; push</button>
        </div>
      </div>
    </div>
  </div>
</header>

<div class="layout">
  <nav class="sidebar" aria-label="Library">
    <section>
      <h2 class="section-label">Library</h2>
      <a href="#" class="nav-item" data-view="all"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span class="grow">All photos</span><span class="count" id="n-all"></span></a>
      <a href="#" class="nav-item" data-view="unassigned"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h10M4 17h6"/></svg><span class="grow">Unassigned</span><span class="count" id="n-unassigned"></span></a>
      <a href="#" class="nav-item" data-view="featured"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg><span class="grow">Featured</span><span class="count" id="n-featured"></span></a>
    </section>
    <section>
      <div class="section-head">
        <h2 class="section-label">Albums</h2>
        <button id="new-album-btn" class="icon-btn" aria-label="New album" title="New album"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
      <form id="new-album" class="new-album" hidden>
        <input id="na-slug" class="input" placeholder="album-slug" required aria-label="Album slug">
        <input id="na-title" class="input" placeholder="Title (optional)" aria-label="Album title">
        <div class="row"><button type="button" class="btn btn-ghost" id="na-cancel">Cancel</button><button class="btn btn-primary">Create</button></div>
      </form>
      <div id="drag-hint" class="drag-hint" hidden></div>
      <div id="album-list"></div>
    </section>
    <section>
      <h2 class="section-label">Tags</h2>
      <div id="tag-list" class="tag-cloud"></div>
    </section>
  </nav>

  <main class="content">
    <div class="toolbar">
      <div>
        <div class="title-row">
          <h1 id="view-title">All photos</h1>
          <span id="album-actions" class="album-actions" hidden>
            <button id="rename-album" class="btn-text link">Rename</button>
            <button id="delete-album" class="btn-text link danger">Delete album</button>
          </span>
        </div>
        <div id="count" class="muted small"></div>
      </div>
      <div class="toolbar-controls">
        <div class="segmented" role="group" aria-label="Sort by">
          <button data-sort="taken">Date taken</button>
          <button data-sort="id">Name</button>
          <button data-sort="caption">Caption</button>
        </div>
        <button id="sort-dir" class="icon-btn bordered" aria-label="Toggle sort direction"></button>
        <label class="size-slider" title="Thumbnail size">
          <svg class="icon sm" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
          <input id="thumb-size" type="range" min="100" max="300" step="10" aria-label="Thumbnail size">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
        </label>
      </div>
    </div>
    <div id="grid" class="grid"></div>
  </main>

  <aside id="inspector" class="inspector" aria-label="Inspector"></aside>
</div>

<div id="drop-overlay" class="drop-overlay" hidden>
  <div class="drop-box">
    <svg class="icon xl" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
    <div>Drop images or folders to add them to the gallery</div>
  </div>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>

<dialog id="confirm" class="modal">
  <form method="dialog">
    <h3 id="confirm-title"></h3>
    <p id="confirm-body" class="muted"></p>
    <label id="confirm-extra" class="check" hidden><input type="checkbox" id="confirm-check"> <span id="confirm-check-label"></span></label>
    <div class="row end">
      <button value="cancel" class="btn btn-ghost">Cancel</button>
      <button value="ok" id="confirm-ok" class="btn btn-danger">Delete</button>
    </div>
  </form>
</dialog>

<dialog id="rename" class="modal">
  <form method="dialog">
    <h3>Rename album</h3>
    <p class="muted small">Changes the title shown on the site. The album's address stays <code id="rename-slug"></code>.</p>
    <input id="rename-input" class="input" aria-label="Album title" autocomplete="off">
    <div class="row end">
      <button type="button" id="rename-cancel" class="btn btn-ghost">Cancel</button>
      <button value="ok" class="btn btn-primary">Save</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
