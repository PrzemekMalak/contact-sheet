baseURL = "https://example.com/"
locale = "en-us"
title = "Example Gallery"
theme = "contact-sheet"
# In this repository the theme is the repo root itself, so the themes directory
# is two levels up (the clone must be named contact-sheet). A standalone site
# keeps the theme in its own themes/ directory and drops this line.
themesDir = "../.."

[params]
  author = "Jane Doe"
  description = "An example photo gallery"
  # What the homepage grid shows: "album" (the homeAlbum below) or "featured".
  homeMode = "featured"
  # Album shown on the homepage grid when homeMode = "album".
  homeAlbum = "mountains"

[menu]
  [[menu.main]]
    name = "Albums"
    pageRef = "/albums"
    weight = 10
  [[menu.main]]
    name = "Featured"
    pageRef = "/featured"
    weight = 15
  [[menu.main]]
    name = "Gear"
    pageRef = "/gear"
    weight = 18
  [[menu.main]]
    name = "Blog"
    pageRef = "/blog"
    weight = 20
  [[menu.main]]
    name = "Tags"
    pageRef = "/tags"
    weight = 30
  [[menu.main]]
    name = "About"
    pageRef = "/about"
    weight = 40

[markup.goldmark.renderer]
  unsafe = true
