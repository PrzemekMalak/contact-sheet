name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  HUGO_VERSION: 0.166.0

jobs:
  tool:
    name: photo tool (Go, incl. end-to-end with Hugo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tool/go.mod
          cache-dependency-path: tool/go.sum
      - name: Install Hugo extended
        run: |
          curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" | tar -xz -C /usr/local/bin hugo
          hugo version
      - name: gofmt
        working-directory: tool
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        working-directory: tool
        run: go vet ./...
      - name: go test
        working-directory: tool
        run: go test ./...

  theme:
    name: theme (page tests, example site)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Install Hugo extended
        run: |
          curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" | tar -xz -C /usr/local/bin hugo
          hugo version
      - run: pip install -r tests/requirements.txt
      - run: pytest tests -q
      - name: Build exampleSite
        working-directory: exampleSite
        run: hugo --minify

  module:
    # Runs the README quick start against the pushed commit, imported the way
    # a site does it (Go module zip rules apply, e.g. directories named
    # "vendor" are dropped). Only on pushes: a pull request's commit is not
    # fetchable as a module from this repo.
    name: theme as a Hugo Module
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/PrzemekMalak/contact-sheet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tool/go.mod
          cache: false
      - name: Install Hugo extended
        run: |
          curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" | tar -xz -C /usr/local/bin hugo
          hugo version
      - name: Quick start with --module (photo init, add, hugo), this commit as the theme
        run: |
          (cd tool && go build -o "$RUNNER_TEMP/photo" ./cmd/photo)
          cd "$RUNNER_TEMP"
          ./photo init site --title "CI Site" --module
          cd site
          cp "$GITHUB_WORKSPACE/tool/internal/imaging/testdata/landscape.jpg" first-shot.jpg
          ../photo add first-shot.jpg -a trip --featured
          # Pin the theme module to this commit, straight from GitHub. go's direct
          # git fetch of this repo (it has a nested module, tool/) can race on
          # git's shallow file ("shallow file has changed since we read it").
          # A retry runs with the repo already in Hugo's module cache and
          # succeeds; hugo --minify then uses that same cache.
          for i in 1 2 3; do
            hugo mod get "github.com/PrzemekMalak/contact-sheet@${GITHUB_SHA}" && break
            [ "$i" = 3 ] && exit 1
            echo "hugo mod get failed (attempt $i), retrying"
            sleep 5
          done
          hugo --minify
          ls public/js/lib/photoswipe/*.css
          grep -q "first-shot" public/albums/trip/index.html
          test -f public/p/first-shot/index.html

  infra:
    name: infra (CDK assertions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infra/requirements-dev.txt
      - run: pip install -r infra/requirements-dev.txt
      - name: pytest
        working-directory: infra
        run: python -m pytest -q
