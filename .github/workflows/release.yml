name: Release

# Push a tag like v0.2.0 to publish ready-to-run `photo` binaries and the
# theme archive that `photo init` / `photo theme update` download.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tool/go.mod
          cache-dependency-path: tool/go.sum
      - name: Test
        working-directory: tool
        run: go test ./...
      - name: Build binaries and theme archive
        run: |
          mkdir -p dist build
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"; exe=""
            [ "$os" = windows ] && exe=".exe"
            out="build/${os}_${arch}"
            mkdir -p "$out"
            (cd tool && CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "../$out/photo$exe" ./cmd/photo)
            cp LICENSE "$out/"
            if [ "$os" = windows ]; then
              (cd "$out" && zip -q "../../dist/photo_${os}_${arch}.zip" "photo$exe" LICENSE)
            else
              tar -czf "dist/photo_${os}_${arch}.tar.gz" -C "$out" photo LICENSE
            fi
          done
          scripts/package-theme.sh "$GITHUB_REF_NAME" dist/contact-sheet-theme.tar.gz
          (cd dist && sha256sum * > checksums.txt)
          ls -la dist
      - name: Check README download links
        # Every releases/latest/download link in README must point at a file
        # this release publishes, or readers get a dead link. Runs before
        # publishing, so a mismatch stops the release.
        run: |
          missing=0
          for name in $(grep -o 'releases/latest/download/[^)]*' README.md | sed 's#.*/##' | sort -u); do
            if [ -f "dist/$name" ]; then echo "ok $name"; else echo "MISSING $name"; missing=1; fi
          done
          exit $missing
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
      - name: Tag the tool module
        # tool/ is its own Go module, so `go install .../tool/cmd/photo@vX.Y.Z`
        # needs a tag named tool/vX.Y.Z on the same commit.
        run: |
          tag="tool/${GITHUB_REF_NAME}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists"
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi
